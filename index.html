<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Angel VS Demon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --a1:#eaf5ff;--a2:#8fd0ff;--a3:#3f86d6;--aG:rgba(143,208,255,.45);
 --d1:#ffe2dc;--d2:#ff5f72;--d3:#c11f3c;--dG:rgba(255,95,114,.45);
 --bg0:#06070d;--pan:rgba(15,18,32,.78);--line:rgba(255,255,255,.10);
 --tx:#e9edf8;--tx2:#8892b0;--gold:#ecc57e;--ok:#63e59b;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
 background:var(--bg0);color:var(--tx);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:disabled{opacity:.22;cursor:not-allowed}
input{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px}
#bg,#fx{position:fixed;inset:0;pointer-events:none!important;overflow:hidden}
#bg{z-index:0;background:linear-gradient(158deg,#080d1a 0%,#06070d 46%,#150810 100%)}
#bg i{position:absolute;border-radius:50%;filter:blur(92px);display:block}
#bg .b1{width:72vmax;height:72vmax;left:-29vmax;top:-27vmax;background:radial-gradient(circle,rgba(63,134,214,.5),transparent 68%);animation:f1 26s ease-in-out infinite}
#bg .b2{width:72vmax;height:72vmax;right:-29vmax;bottom:-29vmax;background:radial-gradient(circle,rgba(193,31,60,.5),transparent 68%);animation:f2 30s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(12vw,9vh) scale(1.15)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-11vw,-8vh) scale(.93)}}
#bg .ln{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 18%,transparent 76%);mask-image:radial-gradient(ellipse at 50% 45%,#000 18%,transparent 76%)}
#bg .vg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,.82) 100%)}
.pt{position:absolute;border-radius:50%;opacity:0;animation:rise linear forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0)}14%{opacity:.9}100%{opacity:0;transform:translateY(-104vh)}}
.scr{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column}
.hide{display:none!important}
.hsvg{width:100%;height:100%;display:block;overflow:visible}
.flame{animation:fk .85s ease-in-out infinite alternate;transform-origin:107px 68px}
@keyframes fk{from{transform:scaleY(.82) scaleX(1.1)}to{transform:scaleY(1.18) scaleX(.9)}}
.halo{animation:hz 3.2s ease-in-out infinite}
@keyframes hz{50%{opacity:.5}}
.hero{width:clamp(84px,26vw,138px);aspect-ratio:140/210;flex-shrink:0}
.hero.A{filter:drop-shadow(0 12px 28px rgba(63,134,214,.45));animation:fA 4s ease-in-out infinite}
.hero.D{filter:drop-shadow(0 12px 28px rgba(193,31,60,.45));animation:fD 4s ease-in-out infinite .6s}
@keyframes fA{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fD{0%,100%{transform:translateY(-8px)}50%{transform:translateY(2px)}}
.heroRow{display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,4vw,34px)}
#scrHome{align-items:center;justify-content:center;padding:16px;gap:13px;overflow-y:auto}
.brand{text-align:center}
.bTop{display:flex;align-items:center;justify-content:center;gap:11px}
.bW{font-size:clamp(24px,7.6vw,50px);font-weight:200;letter-spacing:6px;line-height:1}
.bA{color:var(--a1);text-shadow:0 0 28px var(--aG)}
.bD{color:var(--d1);text-shadow:0 0 28px var(--dG)}
.bX{font-size:clamp(11px,3vw,17px);font-weight:600;letter-spacing:3px;color:var(--gold);opacity:.9}
.bSub{margin-top:7px;font-size:10px;color:var(--tx2);letter-spacing:6px;text-transform:uppercase}
.rule{width:min(300px,70vw);height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.menu{width:min(400px,92vw);display:flex;flex-direction:column;gap:7px}
.mb{position:relative;padding:13px 15px;border-radius:13px;font-size:14px;font-weight:500;
 border:1px solid var(--line);background:rgba(255,255,255,.035);display:flex;align-items:center;gap:12px;
 text-align:left;transition:background .18s,border-color .18s,transform .12s;overflow:hidden}
.mb:active{transform:scale(.985)}
.mb:hover{background:rgba(255,255,255,.075)}
.mb .ic{width:22px;text-align:center;font-size:15px;flex-shrink:0;opacity:.85}
.mb small{display:block;font-size:10px;font-weight:300;color:var(--tx2);margin-top:2px;line-height:1.45}
.mb.A{border-color:rgba(143,208,255,.34);background:linear-gradient(100deg,rgba(63,134,214,.25),rgba(143,208,255,.03))}
.mb.D{border-color:rgba(255,95,114,.34);background:linear-gradient(100deg,rgba(193,31,60,.25),rgba(255,95,114,.03))}
.mb.G{border-color:rgba(236,197,126,.32);background:linear-gradient(100deg,rgba(236,197,126,.17),transparent)}
.mb.ctr{justify-content:center;text-align:center}
.foot{font-size:9px;color:#454c66;text-align:center;letter-spacing:.6px;line-height:1.7}
.warn{width:min(400px,92vw);padding:10px 12px;border-radius:11px;border:1px solid rgba(255,95,114,.45);
 background:rgba(193,31,60,.15);font-size:10.5px;line-height:1.7;color:#ffd8d8}
.warn b{color:#ff9aa5}
.tools{position:fixed;top:10px;right:10px;z-index:80;display:flex;gap:6px}
.tools button{width:33px;height:33px;border-radius:10px;background:rgba(15,18,32,.88);
 border:1px solid var(--line);font-size:13px;display:flex;align-items:center;justify-content:center}
.tools button.off{opacity:.3}
#scrSetup,#scrLobby{align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.pan{width:min(420px,93vw);border-radius:18px;padding:20px;background:linear-gradient(170deg,rgba(21,26,44,.95),rgba(8,11,20,.98));border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.7)}
.pan h2{font-size:17px;text-align:center;font-weight:500;letter-spacing:.6px}
.pan .sb{text-align:center;font-size:11px;color:var(--tx2);margin:6px 0 15px;font-weight:300;line-height:1.6}
.inp{width:100%;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;font-size:15px;outline:none;margin-bottom:8px}
.inp:focus{border-color:var(--gold);background:rgba(255,255,255,.08)}
/* CODE INPUT — no overflow */
.inp.cd{text-align:center;font-size:clamp(17px,5.4vw,23px);font-weight:600;text-transform:uppercase;
 letter-spacing:.32em;text-indent:.32em;padding:12px 8px;font-variant-numeric:tabular-nums;max-width:none;aspect-ratio:auto}
.inp.cd::placeholder{letter-spacing:.2em;text-indent:.2em;opacity:.4}
.er{color:#ff8f8a;font-size:11px;text-align:center;margin:3px 0;min-height:15px;font-weight:300;line-height:1.5}
.nt{font-size:10.5px;color:var(--tx2);text-align:center;margin-top:9px;font-weight:300;line-height:1.6}
.big{font-size:clamp(26px,9vw,42px);font-weight:600;text-align:center;color:var(--gold);margin:2px 0 8px;min-height:46px;
 letter-spacing:.24em;text-indent:.24em;word-break:break-all}
.big.w{color:#3b4260;animation:pl 1.3s infinite}
@keyframes pl{50%{opacity:.4}}
.sp{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.16);border-top-color:var(--gold);border-radius:50%;animation:sn .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sn{to{transform:rotate(360deg)}}
.seats{display:flex;gap:8px;margin:12px 0}
.st{flex:1;padding:10px 6px;border-radius:13px;text-align:center;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.2s}
.st.on.A{border-color:rgba(143,208,255,.6);background:rgba(63,134,214,.13)}
.st.on.D{border-color:rgba(255,95,114,.6);background:rgba(193,31,60,.13)}
.st .av{width:42px;height:63px;margin:0 auto 4px}
.st .nm{font-size:12px;font-weight:500}
.st .ss{font-size:9.5px;color:var(--tx2);display:block;margin-top:2px;font-weight:300}
.row2{display:flex;gap:7px}
.row2 .mb{flex:1;justify-content:center;text-align:center;font-size:12px;padding:10px}
.sidePick{display:flex;gap:9px;margin:10px 0 4px}
.sideCard{flex:1;padding:11px 6px 9px;border-radius:15px;text-align:center;cursor:pointer;
 border:1.5px solid var(--line);background:rgba(255,255,255,.03);transition:.2s;position:relative}
.sideCard .art{width:58px;height:87px;margin:0 auto 5px}
.sideCard .t2{font-size:13px;font-weight:600}
.sideCard .d2{font-size:9px;color:var(--tx2);font-weight:300;margin-top:3px;line-height:1.5}
.sideCard.on.A{border-color:var(--a2);background:rgba(63,134,214,.18);box-shadow:0 0 22px rgba(63,134,214,.3)}
.sideCard.on.D{border-color:var(--d2);background:rgba(193,31,60,.18);box-shadow:0 0 22px rgba(193,31,60,.3)}
.sideCard.on::after{content:'✓';position:absolute;top:6px;right:8px;font-size:12px;color:var(--gold)}
.dif{display:flex;gap:7px;margin:8px 0 4px}
.dif button{flex:1;padding:11px 5px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;font-weight:500;transition:.18s}
.dif button .s{display:block;font-size:8.5px;color:var(--tx2);font-weight:300;margin-top:3px;line-height:1.4}
.dif button.on{border-color:var(--gold);background:rgba(236,197,126,.14);color:var(--gold)}
.lbl{font-size:10px;color:var(--tx2);letter-spacing:1.6px;text-transform:uppercase;margin-top:10px;text-align:center}
.gw{flex:1;display:flex;flex-direction:column;min-height:0;padding:6px;gap:5px}
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:12px;background:var(--pan);border:1px solid var(--line)}
.ib{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:active{transform:scale(.92)}
.mini{width:21px;height:32px;flex-shrink:0}
.hpw{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.hpb{flex:1;height:9px;border-radius:5px;background:rgba(0,0,0,.55);overflow:hidden;border:1px solid rgba(255,95,114,.26);position:relative}
.hpb::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(8.333% - 1px),rgba(0,0,0,.6) calc(8.333% - 1px) 8.333%)}
.hpf{height:100%;background:linear-gradient(90deg,var(--d3),var(--d2),#ffab6b);transition:width .6s cubic-bezier(.3,1.3,.5,1);box-shadow:0 0 10px rgba(255,95,114,.5)}
.hpb.hit{animation:sk .45s}
@keyframes sk{25%{transform:translateX(-5px)}55%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.hpn{font-size:10px;color:var(--tx2);font-weight:500;min-width:34px}
.pill{padding:4px 9px;border-radius:7px;font-size:10px;font-weight:500;white-space:nowrap;flex-shrink:0;border:1px solid}
.pill.A{border-color:rgba(143,208,255,.55);background:rgba(63,134,214,.2);color:var(--a1)}
.pill.D{border-color:rgba(255,95,114,.55);background:rgba(193,31,60,.2);color:var(--d1)}
.lg{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.026);border:1px solid var(--line);font-size:10px;font-weight:300;cursor:pointer}
.lg .dt{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0}
.lg .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.lg .mr{font-size:9px;color:var(--gold);flex-shrink:0;opacity:.8}
.sbar{padding:6px 8px;border-radius:12px;background:var(--pan);border:1px solid var(--line)}
.sbar .cp{font-size:9px;color:var(--tx2);text-align:center;font-weight:300;margin-bottom:5px}
.sr1{display:flex;justify-content:center;margin-bottom:5px}
.sr2{display:flex;justify-content:center;gap:5px}
.su{min-width:34px;height:30px;border-radius:8px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid var(--line);position:relative}
.su.tp{min-width:48px;height:37px;font-size:22px;border-color:rgba(236,197,126,.8);background:linear-gradient(180deg,rgba(236,197,126,.2),rgba(236,197,126,.05));box-shadow:0 0 0 3px rgba(236,197,126,.07),0 0 18px rgba(236,197,126,.2)}
.su.tp::before{content:'TRUMP';position:absolute;top:-7px;font-size:6px;letter-spacing:1.4px;color:var(--gold);background:#0c101c;padding:0 5px;border-radius:3px}
.su.ph{background:rgba(255,255,255,.014);border-style:dashed;opacity:.4;color:#555d78;font-size:12px}
.su.pk{border-color:var(--ok);background:rgba(99,229,155,.1);cursor:pointer;animation:pu 1.3s infinite}
@keyframes pu{50%{box-shadow:0 0 0 4px rgba(99,229,155,.09)}}
.su.rd{color:var(--d2)}.su.bk{color:var(--tx)}
.prow{display:flex;justify-content:center;gap:5px;margin-top:6px;align-items:center;flex-wrap:wrap}
.rst{padding:5px 10px;border-radius:8px;font-size:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx2)}
.pmt{text-align:center;font-size:11px;padding:7px 10px;border-radius:10px;background:rgba(236,197,126,.07);border:1px solid rgba(236,197,126,.24);color:#f2e0b8;min-height:30px;display:flex;align-items:center;justify-content:center;line-height:1.35}
.fld{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;min-height:0}
.hs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 3px;border-radius:13px;min-width:0;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(193,31,60,.12),rgba(255,255,255,.02) 48%,rgba(63,134,214,.12));border:1px solid var(--line);transition:.22s}
.hs.cl{border-color:rgba(236,197,126,.8);box-shadow:0 0 0 1px rgba(236,197,126,.28),0 0 26px rgba(236,197,126,.18);transform:scale(1.045);z-index:5}
.hs.wA{border-color:rgba(143,208,255,.85);box-shadow:0 0 24px var(--aG)}
.hs.wD{border-color:rgba(255,95,114,.85);box-shadow:0 0 24px var(--dG)}
.md{display:flex;flex-direction:column;align-items:center;gap:2px;z-index:6}
.hp5{display:flex;gap:2px;height:9px;align-items:center}
.hp5 s{width:5px;height:5px;border-radius:1px;background:var(--d2);transform:rotate(45deg);display:block;text-decoration:none;transition:.3s;box-shadow:0 0 5px rgba(255,95,114,.55)}
.hp5 s.o{background:#282d45;box-shadow:none}
.hp5 s.br{animation:bh .75s forwards}
@keyframes bh{0%{transform:rotate(45deg) scale(1)}30%{transform:rotate(120deg) scale(2.4);background:#fff;box-shadow:0 0 16px #fff}100%{transform:rotate(45deg) scale(1);background:#282d45;box-shadow:none}}
.hn{font-size:7.5px;color:var(--tx2);font-weight:300;letter-spacing:.8px}
.hs.cl .hn{color:var(--gold)}
.atkZone{position:absolute;left:0;right:0;z-index:7;pointer-events:none;top:24%;height:52%}
.beamL{position:absolute;left:50%;bottom:0;width:9px;height:100%;transform:translateX(-50%);
 transform-origin:bottom center;border-radius:6px;
 background:linear-gradient(0deg,rgba(143,208,255,0),#dff1ff 12%,#ffffff 46%,#c9ecff 78%,rgba(143,208,255,.1));
 box-shadow:0 0 14px #8fd0ff,0 0 34px rgba(63,134,214,.9),0 0 60px rgba(63,134,214,.5);
 animation:beamGrow .58s cubic-bezier(.16,.85,.3,1) forwards}
@keyframes beamGrow{0%{transform:translateX(-50%) scaleY(0) scaleX(.35);opacity:.2}
 42%{transform:translateX(-50%) scaleY(1) scaleX(1.55);opacity:1}
 70%{transform:translateX(-50%) scaleY(1) scaleX(.85);opacity:1}
 100%{transform:translateX(-50%) scaleY(1) scaleX(.55);opacity:.9}}
.boltS{position:absolute;inset:0}
.boltS svg{width:100%;height:100%;display:block;overflow:visible}
.boltS path{fill:none;stroke-linecap:round;stroke-linejoin:round;
 stroke-dasharray:200;stroke-dashoffset:200;animation:zap .56s cubic-bezier(.18,.9,.32,1) forwards}
.boltS .hl{stroke:var(--d2);stroke-width:9;opacity:.42;filter:blur(4px)}
.boltS .cr{stroke:#fff2f2;stroke-width:2.6}
@keyframes zap{0%{stroke-dashoffset:200;opacity:.15}22%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.im{position:absolute;left:50%;width:74%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:8;border-radius:50%;animation:imA .52s ease-out forwards}
.im.a{top:25%;background:radial-gradient(circle,#fff,rgba(143,208,255,.72) 38%,transparent 70%)}
.im.d{top:75%;background:radial-gradient(circle,#fff,rgba(255,95,114,.78) 38%,transparent 70%)}
@keyframes imA{0%{opacity:0;transform:translate(-50%,-50%) scale(.08)}28%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9)}}
.cd{width:100%;max-width:98px;aspect-ratio:5/7;border-radius:9px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14);transition:transform .2s,box-shadow .2s;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.5);z-index:2}
.cd.em{background:rgba(255,255,255,.02);border-style:dashed;opacity:.3}
.cd.bk{display:flex;align-items:center;justify-content:center}
.cd.bk::before{content:'';position:absolute;inset:5px;border-radius:5px;border:1px solid rgba(255,255,255,.12)}
.cd.bk.D{background:linear-gradient(158deg,#33101c,#12050a 78%)}
.cd.bk.A{background:linear-gradient(158deg,#102345,#060b16 78%)}
.cd.bk svg{width:54%;height:54%;opacity:.92}
.cd.fc{background:linear-gradient(160deg,#fbf9f4,#eae6dc 58%,#d4cec0);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#12161f}
.cd.fc::before{content:'';position:absolute;inset:4px;border-radius:5px;border:1px solid rgba(0,0,0,.09)}
.cd.fc.r{color:#c11f3c}
.cd .rk{font-size:clamp(17px,5vw,31px);font-weight:600;line-height:1;letter-spacing:-1px}
.cd .st2{font-size:clamp(12px,3.6vw,21px);line-height:1;margin-top:-1px;opacity:.9}
.cd .ab{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:7px;font-weight:500;color:#7c7566}
.cd .cn{position:absolute;top:3px;left:4px;font-size:7.5px;font-weight:600;opacity:.58}
.cd .cn.b{top:auto;left:auto;bottom:12px;right:4px;transform:rotate(180deg)}
.cd.tr{box-shadow:0 0 0 1.5px var(--gold),0 4px 14px rgba(236,197,126,.28)}
.cd .ey{position:absolute;top:2px;right:2px;width:clamp(15px,4.4vw,21px);height:clamp(15px,4.4vw,21px);
 border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:6;
 background:radial-gradient(circle at 50% 40%,#fff3d6,#ecc57e 62%,#a8792c);
 border:1.5px solid #fff6e0;box-shadow:0 0 10px rgba(236,197,126,.95),0 1px 4px rgba(0,0,0,.55);
 animation:eyeP 1.9s ease-in-out infinite}
.cd .ey svg{width:72%;height:72%;display:block}
@keyframes eyeP{50%{box-shadow:0 0 16px rgba(236,197,126,1),0 1px 4px rgba(0,0,0,.55);transform:scale(1.09)}}
.cd.mn{box-shadow:0 0 0 1px rgba(255,255,255,.3),0 4px 12px rgba(0,0,0,.5)}
.cd.pk2{cursor:pointer;box-shadow:0 0 0 2px var(--ok),0 0 16px rgba(99,229,155,.42);animation:pc 1.2s infinite}
@keyframes pc{50%{box-shadow:0 0 0 2px #9ff3c2,0 0 24px rgba(99,229,155,.7)}}
.cd.sl2{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(236,197,126,.5)}
.cd.fp{animation:fpA .46s cubic-bezier(.3,1.25,.5,1)}
@keyframes fpA{0%{transform:rotateY(90deg) scale(.82);opacity:.35}100%{transform:rotateY(0) scale(1);opacity:1}}
.cd.sm2{animation:smA .48s}
@keyframes smA{0%{transform:scale(1.5) translateY(-22px);opacity:.2}70%{transform:scale(.94)}100%{transform:scale(1)}}
.cd.chgA{animation:chA .5s ease-out forwards;box-shadow:0 0 0 2px var(--a2),0 0 30px var(--a2);z-index:4}

function localCtrl(s){if(NET.mode==='hot')return true;return s===NET.side;}

function beats(mine,theirs,me,ord){
 var r=(me==='priest')?judge(mine,theirs,ord):judge(theirs,mine,ord);
 return me==='priest'?(r==='a'):(r==='b');}
function unseen(me){
 var seen={},i,j,c;
 for(i=0;i<5;i++){c=S.field[me][i];if(c)seen[c.suit+c.rank]=1;}
 for(i=0;i<S.disc.length;i++)seen[S.disc[i].suit+S.disc[i].rank]=1;
 if(S.drawn)seen[S.drawn.suit+S.drawn.rank]=1;
 var op=other(me);
 for(i=0;i<5;i++){c=S.field[op][i];if(c&&c.open[me])seen[c.suit+c.rank]=1;}
 var pool=[];
 for(i=0;i<4;i++)for(j=1;j<=8;j++)if(!seen[SUITS[i]+j])pool.push({suit:SUITS[i],rank:j});
 return pool;}
function pWin(mine,idx,me,pool,ord){
 var op=other(me),oc=S.field[op][idx];
 if(oc&&oc.open[me])return beats(mine,oc,me,ord)?1:0;
 if(!pool.length)return .5;
 var c=0,i;for(i=0;i<pool.length;i++)if(beats(mine,pool[i],me,ord))c++;
 return c/pool.length;}
function hWeight(i,me){var hr=S.hearts[i];
 if(me==='demon'){if(hr<=1)return 3.2;if(hr===2)return 1.7;return 1+(4-hr)*.2;}
 if(hr<=1)return 2.6;if(hr===2)return 1.5;return 1+(4-hr)*.15;}
function boardScore(me,ord,cards){var pool=unseen(me),s=0,i;
 for(i=0;i<5;i++)s+=pWin(cards[i],i,me,pool,ord)*hWeight(i,me);return s;}
function expWins(me,ord){var pool=unseen(me),s=0,i;
 for(i=0;i<5;i++)s+=pWin(S.field[me][i],i,me,pool,ord);return s;}
function bestOrder(me){var perms=[],best=null,bs=-1e9,k;
 (function P(a,c){if(!a.length){perms.push(c);return;}
  for(var i=0;i<a.length;i++){var r=a.slice();r.splice(i,1);P(r,c.concat([a[i]]));}})(SUITS,[]);
 for(k=0;k<perms.length;k++){var sc=boardScore(me,perms[k],S.field[me]);
  if(sc>bs){bs=sc;best=perms[k];}}
 return{o:best,s:bs};}
function noise(){return DIFF===1?(Math.random()-.5)*1.6:DIFF===2?(Math.random()-.5)*.5:0;}
function slip(){return DIFF===1?.32:DIFF===2?.1:0;}
function botSuit(){
 if(!S||!S.pend||S.pend.need!=='suit')return;
 var me=S.current,best;
 if(!S.dealt||(DIFF===1&&Math.random()<.5)){
  var perms=[];(function P(a,c){if(!a.length){perms.push(c);return;}
   for(var i=0;i<a.length;i++){var r=a.slice();r.splice(i,1);P(r,c.concat([a[i]]));}})(SUITS,[]);
  best=perms[(Math.random()*perms.length)|0];
 }else best=bestOrder(me).o;
 var n=0,t=setInterval(function(){
  if(!S||!S.pend||S.pend.need!=='suit'){clearInterval(t);return;}
  pickSuit(best[n++]);if(n>=4)clearInterval(t);},310);}
function abilityValue(rank,me){
 var i,cnt=0,op=other(me);
 if(rank===5)return .75;
 if(rank===8){var ew=expWins(me,S.order);return ew>=3.3?1.6:(ew>=2.9?.35:-1.4);}
 if(rank===3){for(i=0;i<5;i++)if(!S.field[op][i].open[me])cnt++;return cnt?.42:-.1;}
 if(rank===7){var cur=boardScore(me,S.order,S.field[me]),b=bestOrder(me);
  return Math.max(0,(b.s-cur))*.85;}
 if(rank===6){var pool=unseen(me),bg=0;
  for(i=0;i<5;i++){var oc=S.field[op][i];if(!oc||!oc.open[me])continue;
   var c2=pWin(S.field[me][i],i,me,pool,S.order)*hWeight(i,me);
   var nw=pWin(oc,i,me,pool,S.order)*hWeight(i,me);
   if(nw-c2>bg)bg=nw-c2;}
  return bg*.9;}
 if(rank===4)return .12;
 if(rank===2)return .12;
 if(rank===1)return -.35;
 return 0;}
function botTurn(){
 if(!S||S.phase!=='TURN'||busy)return;
 var me=S.current,ord=S.order,ew=expWins(me,ord),i;
 var thr=DIFF===1?2.6:(DIFF===2?3.05:3.3),urgent=false;
 if(me==='demon'){for(i=0;i<5;i++)if(S.hearts[i]===1){
  var pool=unseen(me);if(pWin(S.field[me][i],i,me,pool,ord)>.72)urgent=true;}}
 if(me==='priest'&&S.hp<=2)urgent=(ew>=2.2);
 if(S.deck.length<=2)urgent=true;
 if(!S.after&&(ew+noise()>=thr||urgent)){
  if(!(DIFF===1&&Math.random()<.25))return declare();}
 if(!S.deck.length)return battle();
 doDraw();
 setTimeout(function(){
  if(!S||S.phase!=='CHOICE')return;
  var dr=S.drawn,base=boardScore(me,S.order,S.field[me]);
  var bg=-99,bi=0,j;
  for(j=0;j<5;j++){var cp=S.field[me].slice();cp[j]=dr;
   var g=boardScore(me,S.order,cp)-base;
   g+=abilityValue(S.field[me][j].rank,me)*.55;
   if(g>bg){bg=g;bi=j;}}
  var dv=abilityValue(dr.rank,me),ks=bg+noise(),dsc=dv+noise();
  if(Math.random()<slip()&&Math.random()<.5){doDisc();return;}
  if(ks>dsc&&ks>-.05){doKeep();
   setTimeout(function(){if(S&&S.phase==='PLACING')onSlot(me,bi);},420);}
  else doDisc();
 },DIFF===3?900:1150);}
function botTarget(){
 if(!S||!S.pend)return;
 var p=S.pend,me=S.current,op=other(me),ord=S.order,pool=unseen(me),i,w;
 if(p.need==='own1'){w=0;
  for(i=1;i<5;i++)if(pWin(S.field[me][i],i,me,pool,ord)>pWin(S.field[me][w],w,me,pool,ord))w=i;
  return target(me,w);}
 if(p.need==='opp1'){var ix=[],bw=-1,bi=-1;
  for(i=0;i<5;i++)if(!S.field[op][i].open[me]){ix.push(i);
   if(hWeight(i,me)>bw){bw=hWeight(i,me);bi=i;}}
  if(!ix.length)return endTurn();
  return target(op,DIFF===1?ix[(Math.random()*ix.length)|0]:bi);}
 if(p.need==='own2'){var hi=0;
  for(i=1;i<5;i++)if(hWeight(i,me)>hWeight(hi,me))hi=i;
  var bc=0;for(i=1;i<5;i++)
   if(pWin(S.field[me][i],hi,me,pool,ord)>pWin(S.field[me][bc],hi,me,pool,ord))bc=i;
  if(bc===hi)bc=(hi+1)%5;
  target(me,hi);setTimeout(function(){target(me,bc)},360);return;}
 if(p.need==='pos'){var g=-99,bx=0;
  for(i=0;i<5;i++){var oc=S.field[op][i];if(!oc)continue;
   var cur=pWin(S.field[me][i],i,me,pool,ord)*hWeight(i,me);
   var nv=(oc.open[me]?pWin(oc,i,me,pool,ord):.5)*hWeight(i,me);
   if(nv-cur>g){g=nv-cur;bx=i;}}
  return target(me,bx);}}
